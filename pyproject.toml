[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyCmpl"
version = "3.0.0"
description = "Python API for CMPL (Coliop|Coin Mathematical Programming Language)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Mike Steglich", email = "mike.steglich@th-wildau.de" }]
dependencies = []

[project.optional-dependencies]
excel = ["xlwings"]      # only needed for CmplXlsData (Excel data)

[project.urls]
Homepage = "http://www.coliop.org"

[tool.setuptools]
packages = ["pyCmpl"]

# CMPL runtime of a platform wheel, copied into the package by tools/build_wheel.py
[tool.setuptools.package-data]
pyCmpl = ["binMac/**/*", "binWin/**/*", "binLinux/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
